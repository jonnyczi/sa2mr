# The semantics bitcode is NOT rebuilt: remill compiles it with the build host's default
# triple, so an aarch64-hosted build would give aarch64 bitcode (long double = fp128, other
# ABI) and different lifted IR. The x86_64 package's .bc (built on x86_64 by vcpkg clang
# 14.0.3) is guest-architecture bitcode that any LLVM 14 host can load, so it is taken from
# upstream's release zip, checked file by file.
